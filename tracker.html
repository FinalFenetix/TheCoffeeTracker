    <div class="progress-bar">
        <div class="progress-text">Progress</div>
        <div class="progress-fill" style="--progress-width: 60%"></div>
    </div>

    <script>
        const progressBar = document.querySelector('.progress-fill');
      
        const observer = new IntersectionObserver(entries => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              progressBar.style.animation = 'fillBar 1.2s ease-out forwards';
            }
          });
        }, {
          threshold: 0.5 // Adjust for how visible it needs to be
        });
      
        observer.observe(document.querySelector('.progress-bar'));
    </script>
